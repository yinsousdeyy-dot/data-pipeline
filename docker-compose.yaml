services:
  postgres: 
    image: postgres:16-alpine
    container_name: etl_postgres
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sousdey2026
      POSTGRES_DB: analytics_db
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/ddl/create_tables.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: etl_runner
    depends_on:
      postgres:
        condition: service_healthy
    environment: 
      DB_USER: postgres
      DB_PASSWORD: sousdey2026
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: analytics_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
